name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the pinned Python toolchain
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.13.4
          python-version-file: .python-version
      - name: Install locked policy tools
        run: ./code-polishyw setup
      - name: Review dependencies
        run: ./code-polishyw dependency-review --base origin/master
      - name: Install locked development dependencies
        run: uv sync --frozen --all-extras --no-build --no-install-project
      - name: Require an annotated version tag and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse HEAD)"
          curl --fail --silent --show-error --retry 3 --connect-timeout 15 --max-time 60 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${release_commit}&branch=master&event=push&per_page=1" \
            --output "${RUNNER_TEMP}/pml-ci-runs.json"
          uv run --frozen --no-sync python scripts/release.py "${RELEASE_TAG}" \
            --ci-runs "${RUNNER_TEMP}/pml-ci-runs.json"
      - name: Refresh dependency policy checks
        run: ./code-polishyw supply-chain
      - name: Build source and wheel distributions
        run: uv run --frozen --no-sync python -m build --no-isolation
      - name: Verify the installed wheel
        run: |
          uv pip install --no-deps --no-build dist/*.whl
          uv run --frozen --no-sync python -I - <<'PY'
          import os
          from importlib.metadata import version
          import torch
          import pytorch_metric_learning as pml
          from pytorch_metric_learning.losses import ContrastiveLoss

          expected = os.environ["RELEASE_TAG"][1:]
          assert version("pytorch-metric-learning") == pml.__version__ == expected
          embeddings = torch.tensor([[1., 0.], [1., .1], [-1., 0.], [-1., .1]], requires_grad=True)
          loss = ContrastiveLoss()(embeddings, torch.tensor([0, 0, 1, 1]))
          loss.backward()
          assert torch.isfinite(loss) and torch.isfinite(embeddings.grad).all()
          PY
      - name: Retain the verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/pytorch-metric-learning
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up the pinned publisher
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.13.4
      - name: Download the verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish through PyPI trusted publishing
        run: uv publish --trusted-publishing always

name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the pinned Python toolchain
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: 0.13.4
          python-version-file: .python-version
      - name: Cache the locked policy tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/code-polishy
          key: code-polishy-${{ runner.os }}-${{ hashFiles('.code-polishy.lock.json') }}
      - name: Install locked policy tools
        run: ./code-polishyw setup
      - name: Review dependencies
        run: ./code-polishyw dependency-review --base origin/master
      - name: Install locked development dependencies
        run: uv sync --frozen --all-extras --no-build --no-install-project
      - name: Require an annotated version tag and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse HEAD)"
          curl --fail --silent --show-error --retry 3 --connect-timeout 15 --max-time 60 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${release_commit}&branch=master&event=push&per_page=1" \
            --output "${RUNNER_TEMP}/pml-ci-runs.json"
          uv run --frozen --no-sync python scripts/release.py "${RELEASE_TAG}" \
            --ci-runs "${RUNNER_TEMP}/pml-ci-runs.json"
      - name: Refresh dependency policy checks
        run: ./code-polishyw supply-chain
      - name: Build source and wheel distributions
        run: uv run --frozen --no-sync python -m build --no-isolation
      - name: Verify the wheel with minimum supported runtimes
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/pml-wheel
        run: |
          uv sync --frozen --no-dev --no-build --no-install-project
          uv pip install --python "$UV_PROJECT_ENVIRONMENT/bin/python" --no-deps --no-build dist/*.whl
          uv run --frozen --no-sync python -I scripts/check_wheel.py
      - name: Build the tagged documentation and the version 2 archive
        run: |
          uv run --frozen --no-sync mkdocs build --strict
          git worktree add "$RUNNER_TEMP/v2-docs" v2.9.0
          uv run --frozen --no-sync mkdocs build -f "$RUNNER_TEMP/v2-docs/mkdocs.yml" -d "$PWD/site/v2"
      - name: Retain the documentation site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/
          retention-days: 30
      - name: Retain the verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/pytorch-metric-learning
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up the pinned publisher
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: 0.13.4
      - name: Download the verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish through PyPI trusted publishing
        run: uv publish --trusted-publishing always

  github-release:
    name: Create the GitHub release
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the release notes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Download the verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pypi-distributions
          path: dist/
      - name: Create the release with its notes and distributions
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          prerelease=()
          if [[ "$version" =~ (a|b|rc)[0-9]+$ ]]; then
            prerelease=(--prerelease)
          fi
          python3 -I scripts/release_notes.py "$version" "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${prerelease[@]}"

  docs:
    name: Publish documentation
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy the verified documentation site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-metric-learning"
version = "3.0.0rc3"
description = "Composable metric learning losses, miners, distances, samplers, and retrieval metrics for PyTorch."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Kevin Musgrave" }]
keywords = ["metric learning", "deep learning", "pytorch", "embeddings", "retrieval"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.5.3",
    "torch>=2.14.0",
]

[project.urls]
Homepage = "https://github.com/KevinMusgrave/pytorch-metric-learning"
Documentation = "https://kevinmusgrave.github.io/pytorch-metric-learning/"
Source = "https://github.com/KevinMusgrave/pytorch-metric-learning"
Issues = "https://github.com/KevinMusgrave/pytorch-metric-learning/issues"
Changelog = "https://kevinmusgrave.github.io/pytorch-metric-learning/release-notes/"

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.15.1"]
clustering = ["scikit-learn>=1.9.1"]

[dependency-groups]
dev = [
    "build==1.6.1",
    "faiss-cpu==1.15.1",
    "mkdocs-material==9.7.7",
    "numpy==2.5.3",
    "packaging==26.3",
    "pytest==9.1.1",
    "ruff==0.16.0",
    "scikit-learn==1.9.1",
    "setuptools==84.0.0",
    "torch==2.14.0",
    "ty==0.0.65",
    "uv==0.13.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pytorch_metric_learning = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PIE", "RUF", "SIM", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-config", "--strict-markers", "--disable-plugin-autoload", "-ra"]
xfail_strict = true
markers = [
    "cuda: requires TEST_DEVICE=cuda; deselected on CPU runs",
    "mps: requires an MPS device; deselected where MPS is unavailable",
]

[tool.uv]
required-version = "==0.13.4"
exclude-newer = "2026-09-26T00:00:00Z"

[tool.uv.exclude-newer-package]
uv = "2026-10-26T00:00:00Z"
